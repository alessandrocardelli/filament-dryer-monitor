name: KiCad schematic ERC

on:
  push:
    branches:
      - redesign/buck-sourcing
    paths:
      - .github/workflows/kicad-erc.yml
      - hardware/*.kicad_sch
      - hardware/*.kicad_pro
      - hardware/libs/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  erc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run KiCad 10 ERC
        id: erc
        continue-on-error: true
        uses: actions-for-kicad/kicad-actions@v2-k10.0
        with:
          project_file_name: hardware/Filament_Dryer_Monitor.kicad_pro
          schematic_file_name: hardware/Filament_Dryer_Monitor.kicad_sch
          run_erc: true
          erc_output_file_name: ERC-current.rpt

      - name: Enforce reviewed ERC gate
        shell: bash
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          import sys

          report_path = Path("ERC-current.rpt")
          if not report_path.exists():
              sys.exit("ERC-current.rpt was not generated")

          text = report_path.read_text(encoding="utf-8")
          blocks = re.split(r"(?=^\[)", text, flags=re.MULTILINE)
          violations = []

          for block in blocks:
              match = re.match(r"\[([^]]+)\]", block)
              if not match:
                  continue
              severity = None
              if "\n    ; error" in block:
                  severity = "error"
              elif "\n    ; warning" in block:
                  severity = "warning"
              if severity:
                  violations.append((match.group(1), severity, block))

          errors = [v for v in violations if v[1] == "error"]
          warnings = [v for v in violations if v[1] == "warning"]

          # Explicit reviewed waiver: the board is powered from an external passive
          # connector, so KiCad sees the GND power symbol as not driven by a
          # power-output pin. This is an ERC-modeling issue, not an electrical open.
          if len(errors) != 1:
              sys.exit(f"Expected exactly the single reviewed ERC error; found {len(errors)}")

          err_type, _, err_block = errors[0]
          if err_type != "power_pin_not_driven" or "Symbol #PWR02 Pin 1" not in err_block:
              sys.exit("Unexpected ERC error:\n" + err_block)

          # Reviewed non-blocking warnings. Counts may decrease as schematic drawing
          # cleanup is performed, but new warning classes or increases are regressions.
          allowed_warning_max = {
              "unconnected_wire_endpoint": 7,
              "lib_symbol_mismatch": 2,
              "pin_to_pin": 2,
          }
          counts = Counter(v[0] for v in warnings)

          unknown = sorted(set(counts) - set(allowed_warning_max))
          if unknown:
              sys.exit("Unexpected ERC warning class(es): " + ", ".join(unknown))

          exceeded = {
              key: (counts[key], limit)
              for key, limit in allowed_warning_max.items()
              if counts[key] > limit
          }
          if exceeded:
              sys.exit(f"ERC warning regression: {exceeded}")

          print("ERC gate PASS")
          print("Reviewed waiver: power_pin_not_driven on #PWR02 (external-input GND)")
          print("Reviewed warning counts:", dict(counts))
          PY

      - name: Upload ERC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-erc-report
          path: ERC-current.rpt
          if-no-files-found: error

name: Step07 user-facing clear test feedback

on:
  push:
    branches:
      - fix/step07-clear-test-feedback-2026-10-26
  pull_request:
    branches:
      - experiment/step07-ntc-guard-verified-history-2026-10-25
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Assert current thermal experiment unchanged
        run: |
          git fetch --no-tags origin experiment/step07-ntc-guard-verified-history-2026-10-25
          for path in firmware/AppConfig.h firmware/HeaterStep07GuardTrial.h \
                      firmware/HeaterPulseCommissioning.h firmware/HeaterControlPolicy.h \
                      firmware/FanController.h firmware/NtcSensor.h firmware/Sht45Sensor.h \
                      firmware/ThermalLog.h firmware/CycleController.h firmware/AppTypes.h; do
            [ "$(git rev-parse FETCH_HEAD:$path)" = "$(git hash-object "$path")" ] || {
              echo "::error file=$path::Thermal/sensor/fan behavior change forbidden in UI-only patch"; exit 1;
            }
            echo "UNCHANGED: $path"
          done
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p="firmware/SafetyController.h"
          old=subprocess.check_output(["git","show",f"FETCH_HEAD:{p}"],text=True)
          new=Path(p).read_text()
          marker="  bool coolingRequired(uint32_t nowMs) const {"
          assert old.count(marker)==1
          add=(
            "  // Display-only estimate of the fan cooling countdown. No control decision\n"
            "  // relies on this value; coolingRequired() below remains authoritative.\n"
            "  uint32_t coolingSecondsRemaining(uint32_t nowMs) const {\n"
            "    if (!coolingRequired(nowMs) || !everHeated_) return 0;\n"
            "    const uint32_t elapsed = nowMs - lastHeaterOnMs_;\n"
            "    const uint32_t total = AppConfig::kHeaterCommissioningMode\n"
            "        ? HeaterStep07GuardTrial::parameters().cooldownMs\n"
            "        : AppConfig::kPostHeatCooldownMs;\n"
            "    return elapsed < total ? (total - elapsed + 999U) / 1000U : 0;\n"
            "  }\n"
          )
          assert old.replace(marker,add+marker)==new, "Unexpected safety logic change"
          assert "HOT-261026-S7U" in Path("firmware/FirmwareBuild.h").read_text()
          print("PASS: heater safety byte-identical except read-only countdown accessor")
          PY
      - name: Host regression + Buzzer mock and GUI wording tests
        run: bash firmware/tests/host/run_step07_ui_tests.sh
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 3.3.12 and U8g2 2.36.19
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install U8g2@2.36.19
      - name: Compile exactly the operator-friendly ESP32 firmware; no flash
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware --warnings all

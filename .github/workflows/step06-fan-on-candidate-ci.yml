name: Step 06 - fan-on characterization candidate (default OFF)

on:
  push:
    branches:
      - feature/step06-fan-on-thermal-characterization-2026-10-25
  pull_request:
    branches:
      - feature/wifi-ota-web-logging-2026-10-24
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-only:
    name: ESP32 build and new meaningful heater-profile mock
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify NO heater enable committed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('firmware/AppConfig.h').read_text()
          keys=[
            'kHeaterCommissioningMode',
            'kHeaterStage05TrialReviewed',
            'kHeaterStep06TrialReviewed',
            'kHeaterOutputEnabled',
            'kHeaterProfileApproved',
            'kHeaterNtcModelApproved',
          ]
          for k in keys:
            values=re.findall(r'constexpr\s+bool\s+'+k+r'\s*=\s*(true|false)\s*;',s)
            if values!=['false']:
              raise SystemExit(f'No HEAT permitted in committed Step06 branch: {k}={values}')
          p=Path('firmware/HeaterStep06Candidate.h').read_text()
          for term in ('p.pulseMs = 10000;', 'p.pulseCount = kPulseCount;',
                       'p.cooldownMs = 60000;', 'p.minimumNtcOhms = 19680.0f;',
                       'p.maximumChamberC = 40.0f;'):
            if term not in p:
              raise SystemExit(f'Unexpected candidate parameter: {term}')
          print('PASS: all heater gates OFF; distinct step06 thermal envelope')
          PY
      - name: Prove one flag cannot enable heating
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp firmware/AppConfig.h "$tmp/AppConfig.h"
          printf '#pragma once\n#include <cstdint>\n' >"$tmp/Arduino.h"
          sed -i 's/kHeaterCommissioningMode = false/kHeaterCommissioningMode = true/' "$tmp/AppConfig.h"
          printf '#include "AppConfig.h"\n' >"$tmp/rejected.cpp"
          if g++ -std=c++17 -I "$tmp" -c "$tmp/rejected.cpp" -o "$tmp/rejected.o" >"$tmp/log" 2>&1; then
            echo "::error::Single-flag heater enabling was not blocked"
            exit 1
          fi
          grep -q 'STEP06 heating requires independent physical-trial approval' "$tmp/log" || { cat "$tmp/log"; exit 1; }
          echo 'PASS: heater ON blocked until separate reviewed physical trial'
      - name: Check heater driver and sensor sources against operational baseline
        run: |
          git fetch --no-tags origin feature/wifi-ota-web-logging-2026-10-24
          for path in firmware/HeaterPulseCommissioning.h firmware/HeaterControlPolicy.h firmware/FanController.h firmware/NtcSensor.h firmware/Sht45Sensor.h firmware/CycleController.h firmware/ThermalLog.h; do
            [ "$(git rev-parse "FETCH_HEAD:$path")" = "$(git hash-object "$path")" ] || {
              echo "::error file=$path::Unreviewed change to non-trial runtime"
              exit 1
            }
            echo "UNCHANGED: $path"
          done
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Install U8g2
        run: arduino-cli lib install U8g2@2.36.19
      - name: Compile actual cold-only ESP32 firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware --warnings all
      - name: Simulate actual code and new thermal trial parameters
        run: bash firmware/tests/host/run_step06_tests.sh

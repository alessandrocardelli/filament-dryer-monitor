name: Step 06B - fan 100% extended supervised heating

on:
  push:
    branches:
      - experiment/step06b-fan100-extended-2026-10-25
  pull_request:
    branches:
      - experiment/step06-supervised-heat-2026-10-25
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact protected experiment profile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cfg=Path("firmware/AppConfig.h").read_text()
          required={
            "kHeaterCommissioningMode":"true",
            "kHeaterStage05TrialReviewed":"true",
            "kHeaterStep06TrialReviewed":"true",
            "kHeaterOutputEnabled":"false",
            "kHeaterProfileApproved":"false",
            "kHeaterNtcModelApproved":"false",
          }
          for key,value in required.items():
            got=re.findall(r"constexpr\s+bool\s+"+key+r"\s*=\s*(true|false)\s*;",cfg)
            assert got==[value],(key,got)
          assert re.search(r"kFanBringupRunPercent\s*=\s*100;",cfg)
          assert re.search(r"kFanKickstartMs\s*=\s*1000;",cfg)
          profile=Path("firmware/HeaterStep06Extended.h").read_text()
          for expected in [
            "kPulseCount = 6;", "kPulseHardwareCeilingUs = 20500000;",
            "p.pulseMs = 20000;", "p.gapMs = 12000;",
            "p.prerunMs = 5000;", "p.cooldownMs = 90000;",
            "p.overallTimeoutMs = 330000;",
            "p.minimumNtcOhms = 19680.0f;", "p.maximumChamberC = 40.0f;",
          ]:
            assert expected in profile,expected
          log=Path("firmware/ThermalLog.h").read_text()
          assert "kCapacity = 1400" in log
          assert 'HOT-251025-S6C' in Path("firmware/FirmwareBuild.h").read_text()
          safety=Path("firmware/SafetyController.h").read_text()
          assert "HeaterStep06Extended::kPulseHardwareCeilingUs" in safety
          assert "gpio_set_level" in safety
          print("PASS: S6C one-shot 6x20s/100% fan, thermal aborts and ISR ceiling")
          PY
      - name: Verify heater controller and acquisition fundamentals unchanged
        run: |
          git fetch --no-tags origin experiment/step06-supervised-heat-2026-10-25
          for path in firmware/HeaterPulseCommissioning.h firmware/HeaterControlPolicy.h firmware/FanController.h firmware/Sht45Sensor.h firmware/NtcSensor.h firmware/CycleController.h firmware/AppTypes.h; do
            [ "$(git rev-parse FETCH_HEAD:$path)" = "$(git hash-object "$path")" ] || {
              echo "::error file=$path::Unexpected safety/runtime change"; exit 1;
            }
          done
      - name: Run all native regression and new mock-GPIO tests
        run: bash firmware/tests/host/run_step06b_tests.sh
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and U8g2
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install U8g2@2.36.19
      - name: Compile exact heat-enabled firmware, never flash here
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware --warnings all

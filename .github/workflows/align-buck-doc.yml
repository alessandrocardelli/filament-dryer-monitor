name: Align buck design doc

on:
  push:
    branches:
      - redesign/buck-sourcing
    paths:
      - .github/workflows/align-buck-doc.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/buck-sourcing
      - name: Align BUCK_L7987L_DESIGN.md
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/BUCK_L7987L_DESIGN.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '> **Procurement hold**\n>\n> Final MPN selection/cleanup and the `BOM TME` Google Sheet update are intentionally deferred.\n> MPN/manufacturer fields currently present in the new buck symbols are provisional and are not\n> a final purchasing approval.':
              '> **Sourcing / footprint status**\n>\n> The `BOM TME` sourcing pass and KiCad MPN/manufacturer metadata synchronization have been\n> completed for the selected parts. The next manufacturing-preparation step is the footprint\n> audit against the selected MPNs, followed by PCB synchronization and layout work.',

              '| R34 | 15.2 kΩ | Feedback divider lower resistor |':
              '| R34 | 16 kΩ | Feedback divider lower resistor |',

              '| R36 | 47.5 kΩ | Feedback divider upper resistor |':
              '| R36 | 49.9 kΩ | Feedback divider upper resistor |',

              '- upper: **R36 = 47.5 kΩ**;\n- lower: **R34 = 15.2 kΩ**.':
              '- upper: **R36 = 49.9 kΩ**;\n- lower: **R34 = 16 kΩ**.',

              '`VOUT ≈ 0.8 × (1 + 47.5/15.2) ≈ 3.300 V`':
              '`VOUT ≈ 0.8 × (1 + 49.9/16) ≈ 3.295 V`',

              'So the implemented nominal target is **3.3 V**.':
              'So the implemented nominal target remains **3.3 V** (approximately 3.295 V using the nominal 0.800 V feedback reference).',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected text not found:\n{old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit aligned documentation
        shell: bash
        run: |
          if git diff --quiet -- docs/BUCK_L7987L_DESIGN.md; then
            echo "No documentation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BUCK_L7987L_DESIGN.md
          git commit -m "Align buck design record with sourced feedback values"
          git push origin HEAD:redesign/buck-sourcing

name: Repository consolidation 2026-10-29 (archive and software checks)
on:
  push:
    branches: [cleanup/consolidation-2026-10-29]
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve every audited branch head before any deletion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          m=json.load(open('docs/evidence/repository/2026-10-29-refs.json'))
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          remote=dict((ref,sha) for sha,ref in (l.split() for l in git('ls-remote','origin').splitlines()))
          for r in m['branches']:
              assert remote.get('refs/heads/'+r['branch'])==r['sha'], 'Branch moved; re-audit '+r['branch']
              tag='refs/tags/'+r['tag']
              if tag in remote:
                  assert remote[tag]==r['sha'], 'Archive tag mismatch '+tag
              else:
                  git('push','origin',r['sha']+':'+tag)
          remote=dict((ref,sha) for sha,ref in (l.split() for l in git('ls-remote','origin','refs/tags/archive/2026-10-29/*').splitlines()))
          for r in m['branches']:
              assert remote['refs/tags/'+r['tag']]==r['sha']
          print('PASS: all 22 original heads preserved and remotely verified. No branch deleted.')
          PY

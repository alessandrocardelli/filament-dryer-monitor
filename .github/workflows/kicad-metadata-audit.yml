name: KiCad metadata audit

on:
  push:
    branches:
      - redesign/buck-sourcing
    paths:
      - .github/workflows/kicad-metadata-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit component fields
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re

          wanted = {
              'MPN', 'Manufacturer', 'Function', 'LCSC',
              'Voltage', 'Tolerance', 'Dielectric', 'Power', 'TCR',
              'Manufacturer_Part_Number', 'Manufacturer_Name',
              'Footprint', 'Datasheet', 'Value'
          }

          def balanced_blocks(text, token):
              starts = [m.start() for m in re.finditer(token, text)]
              for start in starts:
                  depth = 0
                  in_string = False
                  escape = False
                  i = start
                  while i < len(text):
                      ch = text[i]
                      if in_string:
                          if escape:
                              escape = False
                          elif ch == '\\':
                              escape = True
                          elif ch == '"':
                              in_string = False
                      else:
                          if ch == '"':
                              in_string = True
                          elif ch == '(':
                              depth += 1
                          elif ch == ')':
                              depth -= 1
                              if depth == 0:
                                  yield text[start:i+1]
                                  break
                      i += 1

          report = {}
          for path in sorted(pathlib.Path('hardware').glob('*.kicad_sch')):
              text = path.read_text(encoding='utf-8')
              for block in balanced_blocks(text, r'\(symbol(?:\s|\")'):
                  mref = re.search(r'\(property\s+"Reference"\s+"([A-Za-z]+\d+)"', block)
                  if not mref:
                      continue
                  ref = mref.group(1)
                  props = {}
                  for m in re.finditer(r'\(property\s+"([^"]+)"\s+"((?:\\.|[^"])*)"', block):
                      name, value = m.group(1), m.group(2)
                      if name in wanted:
                          props[name] = value
                  report[ref] = {'file': str(path), **props, 'nets': []}

          netfile = pathlib.Path('hardware/Filament_Dryer_Monitor.net')
          if netfile.exists():
              nettext = netfile.read_text(encoding='utf-8')
              for block in balanced_blocks(nettext, r'\(net\s'):
                  mname = re.search(r'\(name\s+"((?:\\.|[^"])*)"\)', block)
                  if not mname:
                      continue
                  netname = mname.group(1)
                  for m in re.finditer(r'\(node\s+\(ref\s+"([A-Za-z]+\d+)"\)\s+\(pin\s+"([^"]+)"\)', block):
                      ref, pin = m.group(1), m.group(2)
                      if ref in report:
                          report[ref]['nets'].append({'pin': pin, 'net': netname})

          for ref in report:
              report[ref]['nets'] = sorted(report[ref]['nets'], key=lambda x: (x['pin'], x['net']))

          pathlib.Path('kicad-metadata-audit.json').write_text(
              json.dumps(dict(sorted(report.items())), indent=2, ensure_ascii=False),
              encoding='utf-8'
          )
          print(json.dumps(dict(sorted(report.items())), indent=2, ensure_ascii=False))
          PY
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: kicad-metadata-audit
          path: kicad-metadata-audit.json

name: Step 06 - web telemetry UX fix (no heater changes)

on:
  push:
    branches:
      - fix/step06-web-telemetry-2026-10-25
  # Historical web-only gate; Step06B has a dedicated full heat-profile CI.
  # Do not run stale 'heater files unchanged' assertions against new trial PRs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Syntax, UI mock, full ESP32 and existing heater regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify all heater, sensor, runtime files unchanged
        run: |
          git fetch --no-tags origin experiment/step06-supervised-heat-2026-10-25
          for path in firmware/AppConfig.h firmware/SafetyController.h firmware/HeaterPulseCommissioning.h firmware/HeaterStep06Candidate.h firmware/FanController.h firmware/Sht45Sensor.h firmware/NtcSensor.h firmware/firmware.ino firmware/ThermalLog.h; do
            if [ "$(git rev-parse FETCH_HEAD:$path)" != "$(git hash-object "$path")" ]; then
              echo "::error file=$path::Cannot change heater or data capture in a web-only fix"
              exit 1
            fi
            echo "UNCHANGED: $path"
          done
      - name: Test inline JavaScript and telemetry staleness
        run: node firmware/tests/host/test_web_freshness.js
      - name: Run experimental heater GPIO simulation and historical host suites
        run: bash firmware/tests/host/run_step06_enabled_tests.sh
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core 3.3.12 and U8g2 2.36.19
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install U8g2@2.36.19
      - name: Compile source without flashing or releasing an OTA artifact
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware --warnings all

name: "HOT UI6 Vishay thermistor and configurable HEATER experiment"
on:
  push:
    branches: [experiment/step10-heater-diagnostics-air25-2026-10-28]
    paths: [firmware/**, .github/workflows/step10-heater-diagnostic-ci.yml]
  pull_request:
    branches: [main]
    paths: [firmware/**, .github/workflows/step10-heater-diagnostic-ci.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Confirm HEATER-CAPABLE experiment, no legacy NTC guards or production enable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cfg=Path("firmware/AppConfig.h").read_text()
          safety=Path("firmware/SafetyController.h").read_text()
          app=Path("firmware/firmware.ino").read_text()
          for x in ("kHeaterStep09TrialMode = true;",
                    "kHeaterCommissioningMode = false;",
                    "kHeaterOutputEnabled = false;",
                    "kHeaterProfileApproved = false;",
                    "kHeaterNtcModelApproved = false;"):
            assert x in cfg,x
          assert "HeaterProductAir::Inputs t{};" in safety
          assert "t.heaterTempC=ntc.temperatureC;" in safety
          assert "setHeater(request && cycleActive && trialMenuReady_);" in safety
          assert "ThermalSettings::validForTarget(v,targetAirC)" in safety
          assert "if(AppConfig::kHeaterStep09TrialMode)return !trialMenuReady_;" in safety
          assert "pulseTimerFired_" in safety and "gpio_set_level" in safety
          assert "trialWatchdogFault_=true;" in safety
          assert "kHardwareWindowCeilingUs==20500000" in Path("firmware/tests/host/test_ui5_heater_gpio.cpp").read_text()
          assert "configureThermalSettings(settings.thermal,settings.cycle.targetTempC)" in app
          assert 'HOT-261126-UI6' in Path("firmware/FirmwareBuild.h").read_text()
          ntc=Path("firmware/NtcSensor.h").read_text()
          assert 'VishayNtcCurve::temperatureC' in ntc
          assert 'NtcReadoutCalibration::resistanceOhms' in ntc
          assert ntc.index('if (correctedMv <= AppConfig::kNtcShortThresholdMv)') < ntc.index('const float resistanceOhms = resistanceFromMillivolts(correctedMv)')
          assert ntc.index('if (correctedMv >= AppConfig::kNtcOpenThresholdMv)') < ntc.index('const float resistanceOhms = resistanceFromMillivolts(correctedMv)')
          assert 'kNtcShortThresholdMv = 150.0f;' in cfg
          assert 'kNtcOpenThresholdMv = 3000.0f;' in cfg
          assert 'kNtcDividerSupplyMv = 3311.0f;' in cfg
          assert 'kNtcEffectivePullupOhms = 46572.0f;' in cfg
          assert "attendedSanwa90_85Parameters()" in safety # archived object; NEVER used for GPIO
          assert "feedback_.update(nowMs" not in safety
          assert "ntcSoftPauseOhms" not in safety
          assert "ntcHardTripOhms" not in safety
          assert '"/api/start"' not in Path("firmware/LiveTelemetryServer.cpp").read_text()
          print("PASS source: actual experimental GPIO uses four NVS Celsius thresholds; production still isolated")
          PY
      - name: GPIO HEATER ON/OFF and fault mocks (NO HARDWARE)
        run: bash firmware/tests/host/run_ui5_gpio_mock.sh
      - name: Host-only Vishay, menu, long-duration, dashboard and trace tests
        run: |
          set -euo pipefail
          for src in firmware/tests/host/test_ntc_readout_calibration.cpp firmware/tests/host/test_vishay_ntc_curve.cpp firmware/tests/host/test_thermal_settings.cpp firmware/tests/host/test_product_air_12h.cpp firmware/tests/host/test_material_presets.cpp firmware/tests/host/test_remote_control_policy.cpp firmware/tests/host/test_log_sampling_policy.cpp; do
            bin="$RUNNER_TEMP/$(basename "$src" .cpp)"
            g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic "$src" -o "$bin"
            "$bin"
          done
          node firmware/tests/host/test_web_freshness.js
          node firmware/tests/host/test_remote_dashboard.js
          bash firmware/tests/host/run_step08_real_trace.sh
      - uses: arduino/setup-arduino-cli@v2
      - name: Install exact Arduino ESP32 core and U8g2
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install U8g2@2.36.19
      - name: Compile HEATER-CAPABLE UI6 Arduino IDE source, not physical qualification
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hot-ui6"
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir "$RUNNER_TEMP/hot-ui6" firmware --warnings all 2>&1 | tee "$RUNNER_TEMP/ui6-build.log"
          app="$RUNNER_TEMP/hot-ui6/firmware.ino.bin"
          test -s "$app"
          grep -a -q 'HOT-261126-UI6' "$app"
          sha256sum "$app" | tee "$RUNNER_TEMP/ui6-app.sha256"
          echo "HEATER-CAPABLE experimental UI6 (4 NVS thermal thresholds + Vishay nominal NTC). Source/build only; physical test requires explicit authorization and confirmed NTC installation." >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/ui6-app.sha256" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive non-flashed UI6 firmware for reproducibility
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HOT-UI6-HEATER-CAPABLE-BUILD-NOT-FLASHED
          path: |
            ${{ runner.temp }}/hot-ui6/firmware.ino.bin
            ${{ runner.temp }}/ui6-app.sha256
          retention-days: 30
          if-no-files-found: error

name: STEP13A - AIR30 trial plus 4h product-design host test, GPIO mock and ESP32

on:
  push:
    branches:
      - experiment/step10-heater-diagnostics-air25-2026-10-28
    paths:
      - firmware/**
      - .github/workflows/step10-heater-diagnostic-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - firmware/**
      - .github/workflows/step10-heater-diagnostic-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enforce physical-trial separation and explicitly proposed NTC envelope provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("firmware/AppConfig.h").read_text()
          for t in (
              "kHeaterStep09TrialMode = true;",
              "kHeaterCommissioningMode = false;",
              "kHeaterOutputEnabled = false;",
              "kHeaterProfileApproved = false;",
              "kHeaterNtcModelApproved = false;",
              "kFanBringupRunPercent = 100;",
          ):
              assert t in s, f"Safety configuration changed: {t}"
          h=Path("firmware/HeaterStep09AirFeedback.h").read_text()
          for t in (
              "ntcHardTripOhms = 30000.0f;",
              "ntcSoftPauseOhms = 33000.0f;",
              "ntcResumeOhms = 50000.0f;",
              "maximumRunMs = 900000;",
              "maximumOnWindowMs = 20000;",
              "minimumOffMs = 12000;",
              "maximumTotalHeatMs = 360000;",
              "cooldownMs = 90000;",
              "targetAirC = 30.0f;",
              "kHardwareWindowCeilingUs = 20500000",
          ):
              assert t in h, f"Candidate review required: {t}"
          # Never again allow an arbitrary legacy early-trip value to become
          # a permanent bound only because an old CI asserted it.
          agents=Path("AGENTS.md").read_text()
          assert "Anti-regression: experimental limits are NEVER production" in agents
          assert "PROVISIONAL_EXPERIMENT" in agents
          assert "STEP07 40k" in agents
          assert "S6C" in h and "PROVISIONAL" in h
          assert "STEP12P" in h and "STEP13A" in h
          assert Path("docs/evidence/thermal/2026-10-29-STEP12P-raw.csv").exists()
          assert Path("docs/evidence/thermal/2026-10-29-STEP12P-PHYSICAL-SESSION.md").exists()
          assert "const uint32_t intervalMs = AppConfig::kHeaterStep09TrialMode ? 900U : 250U;" in Path("firmware/ThermalLog.h").read_text()
          assert "kCapacity = 1400;" in Path("firmware/ThermalLog.h").read_text()
          assert "ntcHardTripOhms = 40000.0f;" not in h
          assert "ntcSoftPauseOhms = 45000.0f;" not in h
          assert '"HOT-261029-S13A30"' in Path("firmware/FirmwareBuild.h").read_text()
          assert '"H29-S13A"' in Path("firmware/FirmwareBuild.h").read_text()
          assert '"HOT-261027-S9B"' not in Path("firmware/FirmwareBuild.h").read_text()
          ui=Path("firmware/Ui.h").read_text()
          assert "display_.drawStr(20, 44, FirmwareBuild::kId)" in ui
          assert 'display_.drawStr(2, 44, "FW")' in ui
          assert "display_.drawStr(78, 60, FirmwareBuild::kShortId)" in ui
          assert 2 + 6*len("FW") < 20
          assert 20 + 6 * len("HOT-261029-S13A30") <= 128
          assert 78 + 6 * len("H29-S13A") <= 128
          print("PASS: STEP13A candidate 360s cumulative cap/900s session, PROPOSED NTC33/50k and backup30k, no V1 heater approvals")
          PY
      - name: Verify STEP13A telemetry and no live CSV streaming
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log=Path("firmware/ThermalLog.h").read_text()
          net=Path("firmware/NetworkService.h").read_text()
          app=Path("firmware/firmware.ino").read_text()
          assert "pulse_fault,ntc_fault,air_age_ms,ntc_age_ms,loop_gap_ms" in log
          assert "f.print(header());" in log
          assert "if (live_.cycle || live_.fanPercent > 0)" in net
          assert "trialActive=Boolean(d.cycle)" in net
          assert "safety.commissioningFault()," in app
          assert "loopGapMs);" in app
          print("PASS: S9B fault root cause observable and expanding live CSV blocked")
          PY
      - name: Verify known driver/sensor source files unchanged from S7U
        run: |
          git fetch --no-tags origin 43cb37ccfceded1c185491f88b010b0b176722f6
          for path in firmware/NtcSensor.h firmware/Sht45Sensor.h firmware/FanController.h firmware/CycleController.h firmware/HeaterPulseCommissioning.h firmware/HeaterControlPolicy.h; do
            test "$(git rev-parse FETCH_HEAD:$path)" = "$(git hash-object "$path")" || {
              echo "::error file=$path::Unreviewed sensor/driver modification"
              exit 1
            }
          done
          echo "PASS: existing sensors/drivers and test trace original"
      - name: Native GPIO mock with 360s cap, AIR30/29, sensor/NTC faults, STOP and cooldown
        run: |
          set -euo pipefail
          bash firmware/tests/host/run_step09_feedback.sh | tee "$RUNNER_TEMP/step13a-mock.log"
      - name: Four-hour duration-controlled thermostat DESIGN regression (HOST ONLY, no GPIO)
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic firmware/tests/host/test_long_duration_design.cpp -o "$RUNNER_TEMP/step13a-4hour-thermostat"
          "$RUNNER_TEMP/step13a-4hour-thermostat" | tee "$RUNNER_TEMP/step13a-4hour-thermostat.log"
          python3 - <<'PY'
          from pathlib import Path
          ctl=Path("firmware/HeaterStep09AirFeedback.h").read_text()
          safe=Path("firmware/SafetyController.h").read_text()
          assert "RunPolicy::SupervisedTrial" in ctl
          assert "RunPolicy::DurationControlledDesign" in ctl
          assert "durationControlledDesignParameters()" not in safe, "Do not enable multi-hour heater without physical qualification"
          assert "feedback_{HeaterStep09AirFeedback::parameters()}" in safe
          print("PASS: hardware stays supervised trial-only; 4h product regulator verified only in host simulation")
          PY
      - name: Native plate arithmetic diagnostics (no GPIO)
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            firmware/tests/host/test_heater_plate_diagnostics.cpp \
            -o "$RUNNER_TEMP/step13a-plate-diagnostic"
          "$RUNNER_TEMP/step13a-plate-diagnostic" | tee "$RUNNER_TEMP/step13a-plate-diagnostic.log"
          python3 - <<'PY'
          from pathlib import Path
          m=Path("firmware/HeaterPlateDiagnostics.h").read_text()
          n=Path("firmware/NetworkService.h").read_text()
          u=Path("firmware/Ui.h").read_text()
          assert "NO" in m and "NEVER" in m
          assert "historical_openbox_sanwa_proxy_c" in n
          assert "session_ntc_min_ohms" in n and "ntc_above_hard_ohms" in n
          assert "NTC %.1fk BAK%+.1fk" in u
          # Do not permit the historical reference to determine heating.
          h=Path("firmware/HeaterStep09AirFeedback.h").read_text()
          saf=Path("firmware/SafetyController.h").read_text()
          assert "HeaterPlateDiagnostics" not in h + saf
          assert "ntcHardTripOhms = 30000.0f;" in h
          assert "ntcSoftPauseOhms = 33000.0f;" in h
          assert "ntcResumeOhms = 50000.0f;" in h
          assert "tick(s, 6100, 40000.0f)" in Path("firmware/tests/host/test_step09_feedback_gpio.cpp").read_text()
          assert "assert(s.heaterOn() && !s.faultActive());" in Path("firmware/tests/host/test_step09_feedback_gpio.cpp").read_text()
          print("PASS: plate comparison read-only; STEP13A 33/50/30k candidate checked against source")
          PY
      - name: STEP08 selective offline replay regression
        run: bash firmware/tests/host/run_step08_real_trace.sh
      - name: STEP13A behavior and safe checkpoint invariant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path("firmware/HeaterStep09AirFeedback.h").read_text()
          f=Path("firmware/firmware.ino").read_text()
          l=Path("firmware/ThermalLog.h").read_text()
          ui=Path("firmware/Ui.h").read_text()
          assert "airDemandActive_" in t
          assert "in.ntcOhms >= params_.ntcResumeOhms &&" in t and "airDemandActive_)" in t
          assert "if (in.airC >= params_.targetAirC) airDemandActive_ = false;" in t
          assert "safety.heaterOn() &&" not in f.split("const bool heaterIrreversiblyOff")[1].split("if (loggingSession")[0]
          assert "if (loggingSession && !csvCheckpointAttempted && !safety.heaterOn() &&" in f
          assert "heaterIrreversiblyOff" in f and "thermalLog.saveWhenSafe()" in f
          assert "dirty_ = true; // a post-checkpoint cooldown" in l
          assert "WAIT NTC 50k" in ui and "WAIT AIR 29C" in ui
          print("PASS: independent thermostat latch, explicit wait reason, heater-latched-off checkpoint")
          PY
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core 3.3.12 and U8g2 2.36.19
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install U8g2@2.36.19
      - name: Compile actual STEP13A30 ESP32 application (DO NOT FLASH)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/s13a30-build"
          mkdir -p "$out"
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir "$out" firmware --warnings all 2>&1 | tee "$RUNNER_TEMP/step13a-esp32-build.log"
          echo "PASS: ESP32 binary linked with no DRAM overflow"
          app="$out/firmware.ino.bin"
          test -s "$app" || { echo "::error::OTA application .bin missing"; ls -lah "$out"; exit 1; }
          # ONLY the OTA app partition: never give bootloader, partition table or merged flash to the browser OTA endpoint.
          grep -a -q 'HOT-261029-S13A30' "$app" || { echo "::error::Wrong build ID inside OTA image"; exit 1; }
          cp "$app" "$RUNNER_TEMP/HOT-261029-S13A30-OTA-app.bin"
          cd "$RUNNER_TEMP"
          sha256sum HOT-261029-S13A30-OTA-app.bin | tee HOT-261029-S13A30-OTA-app.sha256
          echo "UNAPPROVED STEP13A candidate only; revised NTC thresholds, no physical clearance. OTA app, DO NOT energize without independent physical preflight." >> "$GITHUB_STEP_SUMMARY"
          cat HOT-261029-S13A30-OTA-app.sha256 >> "$GITHUB_STEP_SUMMARY"
      - name: Publish one OTA-ready application image, NOT bootloader/partition/merged flash
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S13A30-HEAT-CAPABLE-OTA-APP
          path: |
            ${{ runner.temp }}/HOT-261029-S13A30-OTA-app.bin
            ${{ runner.temp }}/HOT-261029-S13A30-OTA-app.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload reproducible results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step13a-candidate-logs
          path: |
            ${{ runner.temp }}/step13a-mock.log
            ${{ runner.temp }}/step13a-4hour-thermostat.log
            ${{ runner.temp }}/step13a-plate-diagnostic.log
            ${{ runner.temp }}/step13a-esp32-build.log
          if-no-files-found: warn

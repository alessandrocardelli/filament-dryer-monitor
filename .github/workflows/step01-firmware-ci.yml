name: Step 01 - ESP32 firmware and host safety tests

on:
  push:
    branches:
      - feature/step01-sensor-diagnostics-2026-10-24
    paths:
      - ".github/workflows/step01-firmware-ci.yml"
      - "firmware/**"
      - "docs/**"
      - "README.md"
  pull_request:
    branches:
      - feature/wifi-ota-web-logging-2026-10-24
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-test:
    name: ESP32 compile + host safety
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 Arduino core 3.3.12
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Install U8g2 2.36.19
        run: arduino-cli lib install U8g2@2.36.19
      - name: Compile actual ESP32 firmware (no flashing)
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware --warnings all
      - name: Run host safety tests
        run: bash firmware/tests/host/run_heater_tests.sh
      - name: Confirm heater control files unchanged from tested operational branch
        run: |
          git fetch --no-tags origin feature/wifi-ota-web-logging-2026-10-24
          for path in firmware/AppConfig.h firmware/SafetyController.h firmware/HeaterPulseCommissioning.h firmware/FanController.h; do
            baseline_sha="$(git rev-parse "FETCH_HEAD:$path")"
            current_sha="$(git hash-object "$path")"
            if [ "$baseline_sha" != "$current_sha" ]; then
              echo "::error file=$path::Safety-critical control file differs from operational branch"
              exit 1
            fi
            echo "UNCHANGED: $path ($current_sha)"
          done

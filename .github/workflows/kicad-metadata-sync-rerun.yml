name: KiCad metadata sync retry

on:
  push:
    branches:
      - redesign/buck-sourcing
    paths:
      - .github/workflows/kicad-metadata-sync-rerun.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/buck-sourcing
      - name: Run corrected metadata sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/kicad-metadata-audit.yml').read_text(encoding='utf-8')
          match = re.search(r"          python - <<'PY'\n(.*?)\n          PY\n", workflow, re.S)
          if not match:
              raise SystemExit('Embedded sync script not found')
          script = textwrap.dedent(match.group(1))
          old = "if balanced_end(text, 0) != len(text):"
          new = "if text[balanced_end(text, text.find('(')):].strip():"
          if old not in script:
              raise SystemExit('Validation line not found')
          script = script.replace(old, new, 1)
          Path('/tmp/kicad_metadata_sync.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/kicad_metadata_sync.py
      - name: Commit synchronized metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/*.kicad_sch hardware/Filament_Dryer_Monitor.kicad_pro
          if git diff --cached --quiet; then
            echo "No metadata changes to commit"
          else
            git commit -m "Sync KiCad component metadata with TME BOM"
            git push origin HEAD:redesign/buck-sourcing
          fi

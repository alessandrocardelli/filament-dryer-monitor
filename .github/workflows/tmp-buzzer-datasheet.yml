name: Final footprint audit closure

on:
  push:
    branches:
      - redesign/buck-sourcing
    paths:
      - .github/workflows/tmp-buzzer-datasheet.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/buck-sourcing
      - name: Apply final footprint audit
        run: python .github/scripts/finalize_footprint_audit.py
      - name: Diff validation
        run: |
          git diff --check
          git status --short
      - name: Commit audit closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hardware docs/BUCK_L7987L_DESIGN.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Close sourced component footprint audit'
            git push origin HEAD:redesign/buck-sourcing
          fi

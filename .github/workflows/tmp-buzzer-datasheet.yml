name: Temporary strict pinout correction

on:
  push:
    branches:
      - redesign/buck-sourcing
    paths:
      - .github/workflows/tmp-buzzer-datasheet.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/buck-sourcing
      - name: Apply confirmed pinout fixes
        run: python .github/scripts/apply_strict_pinout_fixes.py
      - name: Validate diff
        run: |
          git diff --check
          git status --short
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hardware
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix strict symbol and pinout mappings'
            git push origin HEAD:redesign/buck-sourcing
          fi

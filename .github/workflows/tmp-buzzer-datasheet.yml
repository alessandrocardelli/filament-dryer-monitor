name: Temporary final strict pinout audit

on:
  push:
    branches:
      - redesign/buck-sourcing
    paths:
      - .github/workflows/tmp-buzzer-datasheet.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/buck-sourcing
      - name: Finalize strict audit
        run: python .github/scripts/finalize_pinout_audit.py
      - name: Validate diff
        run: |
          git diff --check
          git status --short
      - name: Commit final audit corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hardware
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Finalize strict component pinout audit'
            git push origin HEAD:redesign/buck-sourcing
          fi

name: Temporary post-audit documentation sync

on:
  push:
    branches:
      - redesign/buck-sourcing
    paths:
      - .github/workflows/tmp-buzzer-datasheet.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/buck-sourcing
      - name: Sync project documentation
        run: python .github/scripts/sync_post_audit_docs.py
      - name: Validate diff
        run: |
          git diff --check
          git status --short
      - name: Commit documentation sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/BUCK_L7987L_DESIGN.md hardware/docs/PROCUREMENT.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Sync project state after strict pinout audit'
            git push origin HEAD:redesign/buck-sourcing
          fi
